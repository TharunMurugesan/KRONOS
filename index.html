  <!-- Apply theme BEFORE Tailwind/React load to avoid a flash of light mode -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      // Default = dark. Honor user's saved preference if present.
      var theme = saved === "light" ? "light" : "dark";
      if (theme === "dark") document.documentElement.classList.add("dark");
    })();
  </script>

    /* ----- LIGHT THEME (default) ----- */
    :root {

      --accent:     #171717;
      --accent2:    #000000;
      --accentSoft: #EFEFEF;
      --ok:         #404040;
      --warn:       #525252;
      --danger:     #171717;
      --spotlight:  rgba(0,0,0,0.05);
      --scrollbar:  #C7C7C7;
      --scrollbar-hover: #9A9A9A;
    }
    /* ----- DARK THEME ----- */
    html.dark {
      --paper:      #0E0E0E;   /* near-black background */
      --surface:    #161616;   /* card surface */
      --surface2:   #1C1C1C;   /* inputs / hover surface */
      --ink:        #F2F2F2;   /* primary text */
      --ink2:       #A3A3A3;   /* secondary text */
      --ink3:       #6B6B6B;   /* tertiary text */
      --line:       #232323;   /* hairline borders */
      --line2:      #353535;   /* stronger borders */
      --accent:     #F2F2F2;   /* light accent (buttons) */
      --accent2:    #FFFFFF;   /* hover on accent */
      --accentSoft: #232323;   /* soft accent backdrop */
      --ok:         #C7C7C7;
      --warn:       #A3A3A3;
      --danger:     #F2F2F2;
      --spotlight:  rgba(255,255,255,0.06);
      --scrollbar:  #353535;
      --scrollbar-hover: #525252;
    }

    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .font-serif {
      font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    .wordmark {
      font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: 0.32em;
      color: var(--ink);
      text-transform: uppercase;
    }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease-out both; }

    /* Quiet scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Form fields */
    input, textarea, select { background: var(--surface); color: var(--ink); }
    input::placeholder, textarea::placeholder { color: var(--ink3); }

    /* ----- NEWS GRID + CARD HOVER -----
       1) When the user hovers anywhere inside the grid, every card dims
          (opacity 0.4). The card actually under the cursor stays at 1.
          That highlights the focused article — same trick Claude uses on
          its footer link groups.
       2) The focused card also gets a soft cursor-following radial
          spotlight (driven by --mx / --my updated in JS), a 2px lift,
          and a brighter border. */
    .news-grid .news-card {
      transition: opacity 0.3s ease, transform 0.25s ease,
                  border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .news-grid:hover .news-card { opacity: 0.4; }
    .news-grid:hover .news-card:hover { opacity: 1; }

    .news-card {
      position: relative;
      overflow: hidden;
    }
    .news-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 50%),
        var(--spotlight),
        transparent 60%
      );
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 0;
    }
    .news-card:hover::before { opacity: 1; }
    .news-card:hover {
      border-color: var(--line2);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    }
    html.dark .news-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    }
    .news-card > * { position: relative; z-index: 1; }

    /* Theme toggle button shimmer on click */
    .theme-toggle-icon {
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
    }

    /* ----- WELCOME OVERLAY -----
       Plays once on login. Sequence (total ~2.7s):
         0.0–0.3s   backdrop + spotlight fade in
         0.3–1.0s   KRONOS wordmark blooms up
         1.1–1.7s   greeting line rises in
         1.7–2.2s   hold
         2.2–2.7s   everything fades out */
    .welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--paper);
      opacity: 1;
      display: grid;
      place-items: center;
      /* fill-mode 'both' applies the 0% keyframe instantly on mount, so
         the backdrop is solid from the very first painted frame. */
      animation: welcomeOverlayFade 2.7s ease both;
    }
    .welcome-overlay::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(
        720px circle at center,
        var(--spotlight),
        transparent 70%
      );
      opacity: 0;
      animation: welcomeSpot 2.7s ease forwards;
    }
    /* Subtle ring around the spotlight, very faint */
    .welcome-overlay::after {
      content: "";
      position: absolute;
      width: 520px; height: 520px;
      border-radius: 50%;
      border: 1px solid var(--line);
      opacity: 0;
      animation: welcomeRing 2.7s ease forwards;
    }
    .welcome-content {
      position: relative;
      text-align: center;
      padding: 0 1rem;
    }
    .welcome-brand {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      letter-spacing: 0.32em;
      color: var(--ink);
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      animation: welcomeBrandIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    .welcome-greeting {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      color: var(--ink2);
      margin-top: 1.75rem;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(10px);
      animation: welcomeGreetIn 0.7s ease 1.05s forwards;
    }
    .welcome-greeting strong {
      color: var(--ink);
      font-weight: 600;
    }
    .welcome-divider {
      width: 32px;
      height: 1px;
      background: var(--line2);
      margin: 1.25rem auto 0;
      transform: scaleX(0);
      transform-origin: center;
      animation: welcomeDivider 0.6s ease 0.95s forwards;
    }
    @keyframes welcomeOverlayFade {
      /* Solid from the first frame so the app behind it is never
         visible. Only fades out at the very end of the animation. */
      0%   { opacity: 1; }
      82%  { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    @keyframes welcomeSpot {
      0%   { opacity: 0; }
      18%  { opacity: 1; }
      82%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes welcomeRing {
      0%   { opacity: 0; transform: scale(0.85); }
      30%  { opacity: 0.6; transform: scale(1); }
      75%  { opacity: 0.4; transform: scale(1.04); }
      100% { opacity: 0; transform: scale(1.08); }
    }
    @keyframes welcomeBrandIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes welcomeGreetIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes welcomeDivider {
      to { transform: scaleX(1); }
    }
  </style>
</head>

  function cleanDescription(html, maxLen = 260) {
    if (!html) return "";
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    let text = (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
    if (text.length > maxLen) text = text.slice(0, maxLen).trim() + "…";
    return text;
  }

  function detectAITool(title, description) {
    const haystack = (title + " " + description).toLowerCase();
    const tools = window.AI_TOOLS;
    // Longest keys first so "github copilot" matches before "copilot".
    const keys = Object.keys(tools).sort((a, b) => b.length - a.length);
    for (const key of keys) {
      if (haystack.includes(key)) {
        // Resolve aliasOf chain to the canonical entry
        let entry = tools[key];
        let canonicalKey = key;
        while (entry && entry.aliasOf) {
          canonicalKey = entry.aliasOf;
          entry = tools[entry.aliasOf];
        }
        if (!entry) return null;
        return { name: entry.displayName || canonicalKey, key: canonicalKey, ...entry };
      }
    }
    return null;
  }

  function isAIArticle(title, description) {
    const haystack = (" " + title + " " + description + " ").toLowerCase();
    if (detectAITool(title, description)) return true;
    return window.AI_KEYWORDS.some(k => haystack.includes(k));
  }

  function splitHeadline(title, description) {
    const heading = title.length > 110 ? title.slice(0, 107).trim() + "…" : title;

  async function fetchOneFeed(source) {
    const url = window.RSS_PROXY + encodeURIComponent(source.url);
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Failed to fetch ${source.name}: HTTP ${res.status}`);
    const json = await res.json();
    if (json.status !== "ok") throw new Error(`Bad RSS response for ${source.name}`);
    return (json.items || []).map(item => ({
      id: source.name + "::" + item.link,
      source: source.name,
      title: item.title || "(no title)",
      description: item.description || item.content || "",
      link: item.link,
      pubDate: item.pubDate
    }));
  }

  async function fetchAllNews() {
    const sources = window.NEWS_SOURCES;
    const results = await Promise.allSettled(sources.map(fetchOneFeed));
    let items = [];
    const errors = [];
    results.forEach((r, i) => {
      if (r.status === "fulfilled") items = items.concat(r.value);
      else errors.push({ source: sources[i].name, error: r.reason?.message || "unknown" });
    });
    items.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));
    return { items, errors };

  // ============================================================================
  // AUTH HELPERS
  //
  // PRIVACY MODEL
  //   • All user data (name, email, hashed password, salt) lives in browser
  //     localStorage on this device only. Nothing leaves the browser.
  //   • Passwords are NEVER stored in plain text. We use PBKDF2-SHA256 with
  //     200,000 iterations and a per-user random 16-byte salt (Web Crypto API).
  //   • The only outbound request the auth flow makes is the OTP email send,
  //     which goes directly from your browser to EmailJS — no third party
  //     server in between, and only the recipient email + OTP are sent.
  // ============================================================================

  const PBKDF2_ITERATIONS = 200000;
  const SALT_BYTES = 16;
  const HASH_BITS = 256;

  function bytesToB64(bytes) {
    return btoa(String.fromCharCode(...new Uint8Array(bytes)));
  }
  function b64ToBytes(b64) {
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  }

  async function hashPassword(password, saltBytes, iterations = PBKDF2_ITERATIONS) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: saltBytes, iterations, hash: "SHA-256" },
      keyMaterial, HASH_BITS
    );
    return new Uint8Array(bits);
  }

  function randomSalt() {
    return crypto.getRandomValues(new Uint8Array(SALT_BYTES));
  }

  // Constant-time comparison to avoid timing leaks (paranoid but cheap)
  function constantTimeEqual(a, b) {
    if (a.length !== b.length) return false;
    let diff = 0;
    for (let i = 0; i < a.length; i++) diff |= a[i] ^ b[i];
    return diff === 0;
  }

  // ----- USER STORE -----
  // Users live in two places:
  //   1) ./users.json   — a static seed file bundled with the deploy. It is
  //      fetched once on app startup (kickFetchUsersJson() below) and any
  //      account present in it is merged into localStorage so the account
  //      works in ANY browser that loads the hosted site, not just the
  //      browser it was registered in.
  //   2) localStorage["users"]  — the live, writable store. Browsers cannot
  //      write back to a static JSON file at runtime, so registration writes
  //      land here. To make accounts visible to other browsers, the contents
  //      of localStorage["users"] need to be promoted into users.json and
  //      redeployed (or this layer should be replaced by a real backend).
  function loadUsers() {
    try { return JSON.parse(localStorage.getItem("users") || "{}"); }
    catch { return {}; }
  }
  function saveUsers(users) {
    localStorage.setItem("users", JSON.stringify(users));
  }
  // Fetch the seed file once on startup and merge its entries into the live
  // store. Runs in the background — login/register can still proceed while
  // the fetch is in flight; the merge just makes more accounts available.
  async function kickFetchUsersJson() {
    try {
      const res = await fetch("./users.json", { cache: "no-store" });
      if (!res.ok) return;
      const payload = await res.json();
      const seed = payload && payload.users && typeof payload.users === "object" ? payload.users : null;
      if (!seed) return;
      const local = loadUsers();
      let added = 0;
      for (const [email, rec] of Object.entries(seed)) {
        const key = email.trim().toLowerCase();
        if (local[key]) continue; // never overwrite a local registration
        if (!rec || typeof rec.salt !== "string" || typeof rec.hash !== "string") continue;
        local[key] = rec;
        added++;
      }
      if (added > 0) {
        saveUsers(local);
        try { console.log("[Kronos] Merged " + added + " account(s) from users.json. Total: " + Object.keys(local).length); } catch {}
      }

  async function registerUser(name, email, password) {
    const users = loadUsers();
    const key = email.trim().toLowerCase();
    if (users[key]) throw new Error("An account with this email already exists.");
    const salt = randomSalt();
    const hash = await hashPassword(password, salt);
    users[key] = {
      name: name.trim(),
      salt: bytesToB64(salt),
      hash: bytesToB64(hash),
      iterations: PBKDF2_ITERATIONS,
      createdAt: Date.now()

    saveUsers(users);
    return { email: key, name: users[key].name };
  }

  async function verifyLogin(email, password) {
    const users = loadUsers();
    const key = email.trim().toLowerCase();
    const u = users[key];
    if (!u) throw new Error("No account found for this email. Please register first.");
    const salt = b64ToBytes(u.salt);
    const expected = b64ToBytes(u.hash);
    const actual = await hashPassword(password, salt, u.iterations || PBKDF2_ITERATIONS);
    if (!constantTimeEqual(expected, actual)) throw new Error("Incorrect password.");
    return { email: key, name: u.name };
  }

    if (!payload || typeof payload !== "object" || !payload.users || typeof payload.users !== "object") {

    for (const [email, u] of Object.entries(payload.users)) {

          || typeof u.salt !== "string" || typeof u.hash !== "string"
          || typeof u.iterations !== "number") {

    const existing = loadUsers();
    let added = 0, overwritten = 0, skipped = 0;

        } else {

          overwritten++;
        }
      } else {

        added++;
      }
    }
    saveUsers(existing);
    return { added, overwritten, skipped, total: Object.keys(existing).length };
  }

  // ---------- MARKDOWN RENDERER ----------
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function renderMarkdown(md) {
    if (!md) return "";
    const codeBlocks = [];
    md = md.replace(/```([\s\S]*?)```/g, (_, code) => {
      codeBlocks.push(code);
      return ` CODE${codeBlocks.length - 1} `;
    });
    let html = escapeHtml(md);
    html = html.replace(/^### (.+)$/gm, '<h3 class="font-serif text-base font-semibold mt-5 mb-2 text-ink">$1</h3>');
    html = html.replace(/^## (.+)$/gm,  '<h2 class="font-serif text-lg font-semibold mt-6 mb-2.5 text-ink">$1</h2>');
    html = html.replace(/^# (.+)$/gm,   '<h1 class="font-serif text-xl font-semibold mt-6 mb-3 text-ink">$1</h1>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-ink">$1</strong>');
    html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em class="italic">$2</em>');
    html = html.replace(/`([^`]+)`/g, '<code class="bg-paper border border-line px-1.5 py-0.5 rounded text-[0.875em] text-accent2 font-mono">$1</code>');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener" class="text-accent2 underline underline-offset-2 hover:text-accent">$1</a>');
    html = html.replace(/(?:^|\n)((?:\d+\.\s+.+\n?)+)/g, (m) => {
      const items = m.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, "")).map(li => `<li class="mb-1.5 pl-1.5">${li}</li>`).join("");
      return `\n<ol class="list-decimal list-outside space-y-1 my-3 pl-6 marker:text-ink3 marker:font-medium">${items}</ol>`;
    });
    html = html.replace(/(?:^|\n)((?:[-*]\s+.+\n?)+)/g, (m) => {
      const items = m.trim().split(/\n/).map(l => l.replace(/^[-*]\s+/, "")).map(li => `<li class="mb-1 pl-1.5">${li}</li>`).join("");
      return `\n<ul class="list-disc list-outside space-y-1 my-3 pl-6 marker:text-ink3">${items}</ul>`;
    });
    html = html.split(/\n{2,}/).map(block => {
      if (/^\s*<(h\d|ol|ul|pre)/.test(block)) return block;
      return `<p class="mb-3 leading-[1.7] text-ink2">${block.replace(/\n/g, "<br/>")}</p>`;
    }).join("\n");
    html = html.replace(/ CODE(\d+) /g, (_, i) =>
      `<pre class="bg-ink text-paper rounded-lg p-4 my-4 overflow-x-auto text-[13px] leading-relaxed font-mono"><code>${escapeHtml(codeBlocks[+i].trim())}</code></pre>`);
    return html;
  }

  // ---------- NEWS CARD ----------
  function NewsCard({ item }) {

    const isAI = !!ai || isAIArticle(item.title, item.description);
    // Cursor-tracking spotlight: update CSS vars on mousemove so the
    // ::before radial gradient follows the pointer inside this card.
    const onMove = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      e.currentTarget.style.setProperty("--mx", `${e.clientX - rect.left}px`);
      e.currentTarget.style.setProperty("--my", `${e.clientY - rect.top}px`);
    };
    return (
      <article onMouseMove={onMove}
        className="news-card bg-surface rounded-xl border border-line p-6 flex flex-col group">
        <div className="flex items-center gap-2.5 mb-3 text-xs">

              <span className="w-1 h-1 rounded-full bg-accent2"/> AI

        <div className="flex flex-wrap items-center gap-3 mt-auto pt-4 border-t border-line">

  // ---------- NEWS PAGE ----------

    const [filter, setFilter] = useState("all");
    const [query, setQuery] = useState("");

    const load = useCallback(async () => {
      setLoading(true);
      setErrors([]);
      try {
        const { items, errors } = await fetchAllNews();
        setItems(items);
        setErrors(errors);
      } catch (e) {
        setErrors([{ source: "all", error: e.message }]);
      } finally {
        setLoading(false);
      }
    }, []);

    useEffect(() => { load(); }, [load]);

    const sources = useMemo(() => Array.from(new Set(items.map(i => i.source))), [items]);

    const filtered = useMemo(() => {
      let out = items;

        const q = query.toLowerCase();
        out = out.filter(i =>

  // ---------- SEARCH PAGE ----------
  function SearchPage({ userKey = "anon" }) {
    // Per-user storage prefixes so different accounts on the same device stay isolated
    const providerKeyName = `aiProvider_${userKey}`;
    const apiKeyStorageName = (p) => `apiKey_${userKey}_${p}`;
    const historyKeyName = `qaHistory_${userKey}`;

    const [provider, setProvider] = useState(() => localStorage.getItem(providerKeyName) || "gemini");
    const [apiKey, setApiKey] = useState(() => localStorage.getItem(apiKeyStorageName(localStorage.getItem(providerKeyName) || "gemini")) || "");
    const [showKeyInput, setShowKeyInput] = useState(!apiKey);
    const [tempKey, setTempKey] = useState("");
    const [question, setQuestion] = useState("");
    const [answer, setAnswer] = useState("");
    const [error, setError] = useState("");
    const [loading, setLoading] = useState(false);
    const [history, setHistory] = useState(() => {
      try { return JSON.parse(localStorage.getItem(historyKeyName) || "[]"); }
      catch { return []; }
    });

    // When provider changes, load that provider's saved key
    const switchProvider = (p) => {
      setProvider(p);
      localStorage.setItem(providerKeyName, p);
      const saved = localStorage.getItem(apiKeyStorageName(p)) || "";
      setApiKey(saved);
      setTempKey("");
      setError("");
      setShowKeyInput(!saved);
    };

    const saveKey = () => {
      if (!tempKey.trim()) return;
      localStorage.setItem(apiKeyStorageName(provider), tempKey.trim());
      setApiKey(tempKey.trim());
      setTempKey("");
      setShowKeyInput(false);
      setError("");
    };

    const clearKey = () => {
      localStorage.removeItem(apiKeyStorageName(provider));
      setApiKey("");
      setShowKeyInput(true);
    };

    const ask = async (q) => {
      const finalQ = (q ?? question).trim();
      if (!finalQ) return;
      if (!apiKey) { setShowKeyInput(true); setError(`Please save your ${PROVIDERS[provider].label} API key first.`); return; }
      setLoading(true);
      setError("");
      setAnswer("");
      try {
        const text = await askProvider(provider, apiKey, finalQ);
        setAnswer(text);
        const newHistory = [{ q: finalQ, a: text, t: Date.now(), provider }, ...history].slice(0, 10);
        setHistory(newHistory);
        localStorage.setItem(historyKeyName, JSON.stringify(newHistory));
      } catch (e) {
        setError(e.message || String(e));
      } finally {
        setLoading(false);
      }
    };

    const cfg = PROVIDERS[provider];

    const examples = [
      "How do I connect Claude with Gmail?",
      "How do I use Cursor with my existing GitHub repo?",

      "How do I create an image with Midjourney for the first time?",

          <h1 className="font-serif text-4xl md:text-5xl text-ink leading-[1.1] mb-3">
            How can Kronos help, <span className="italic text-accent2">{user_first_name(history)}</span>?
          </h1>
          <p className="text-ink2 text-[15px] max-w-xl mx-auto leading-relaxed">
            Ask anything about an AI tool — Claude, ChatGPT, Gemini, Cursor, Midjourney —
            and get a clear, step-by-step answer.
          </p>
        </div>

        {/* Chat input — the hero element */}
        <form onSubmit={(e) => { e.preventDefault(); ask(); }} className="mb-4">
          <div className="bg-surface rounded-2xl border border-line2 shadow-soft hover:shadow-lift focus-within:shadow-lift focus-within:border-ink2 transition-all">
            <textarea
              value={question}
              onChange={e => setQuestion(e.target.value)}
              placeholder="Ask Kronos anything…"
              rows={3}
              className="w-full p-5 pb-2 bg-transparent border-0 outline-none text-[15px] text-ink resize-none placeholder:text-ink3"
              onKeyDown={(e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); ask(); }
              }}
            />
            <div className="flex items-center justify-between px-4 pb-3 pt-1">
              <div className="flex items-center gap-1 text-xs text-ink3">
                <span className="hidden sm:inline">Provider:</span>
                {Object.entries(PROVIDERS).map(([k, v]) => (
                  <button key={k} type="button" onClick={() => switchProvider(k)}
                    className={`px-2.5 py-1 rounded-md font-medium transition ${
                      provider === k
                        ? "bg-ink text-paper"
                        : "text-ink2 hover:bg-line/60"
                    }`}>
                    {v.shortLabel}{v.free && <span className="ml-1 opacity-60">·free</span>}
                  </button>
                ))}
              </div>
              <button type="submit" disabled={loading || !question.trim()}
                className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-md bg-accent text-white text-sm font-medium hover:bg-accent2 disabled:opacity-50 disabled:cursor-not-allowed transition">
                {loading ? (
                  <>
                    <span className="w-3 h-3 border-2 border-white/40 border-t-white rounded-full animate-spin"/>
                    Thinking
                  </>
                ) : (
                  <>
                    Send
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M5 12h14M13 5l7 7-7 7"/>
                    </svg>
                  </>
                )}
              </button>
            </div>
          </div>
          <div className="text-[11px] text-ink3 mt-2 text-center">⌘/Ctrl + Enter to send</div>
        </form>

        {/* API key panel — quiet, collapsed by default if saved */}
        <div className="mb-8">
          {!showKeyInput ? (
            <div className="flex items-center justify-center gap-3 text-xs text-ink2">
              <span className="inline-flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-ok"/>
                {cfg.shortLabel} key connected
              </span>
              <span className="text-ink3">·</span>
              <button onClick={() => setShowKeyInput(true)} className="hover:text-ink underline-offset-2 hover:underline">Change</button>
              <button onClick={clearKey} className="hover:text-danger underline-offset-2 hover:underline">Forget</button>
            </div>
          ) : (
            <div className="p-4 rounded-xl border border-line2 bg-surface">
              <div className="text-sm font-medium text-ink mb-1">Connect {cfg.label}</div>
              <p className="text-xs text-ink2 mb-3 leading-relaxed">
                {cfg.free && <span className="inline-block mr-2 px-1.5 py-0.5 rounded bg-ok/15 text-ok font-medium text-[11px]">FREE</span>}
                {cfg.note} Get a key at{" "}
                <a href={cfg.keyUrl} target="_blank" rel="noopener" className="text-accent2 underline underline-offset-2">{cfg.keyUrlLabel}</a>.
                Stored only in this browser.

              <div className="flex gap-2 flex-wrap">
                <input type="password" value={tempKey} onChange={e => setTempKey(e.target.value)} placeholder={cfg.hint}
                  className="flex-1 min-w-[200px] px-3 py-2 rounded-md border border-line focus:border-accent focus:ring-2 focus:ring-accentSoft outline-none text-sm font-mono"
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); saveKey(); } }}/>
                <button onClick={saveKey} className="px-3.5 py-2 rounded-md bg-ink text-paper text-sm font-medium hover:bg-ink/90">Save</button>
                {apiKey && <button onClick={() => setShowKeyInput(false)} className="px-3 py-2 rounded-md text-sm text-ink2 hover:bg-line/60">Cancel</button>}
              </div>
            </div>
          )}
        </div>

        {/* Suggestion chips when idle */}
        {!answer && !loading && !error && (
          <div className="mb-8 fade-up">
            <div className="text-xs uppercase tracking-[0.18em] text-ink3 mb-3 text-center">Try asking</div>
            <div className="grid sm:grid-cols-2 gap-2">
              {examples.map(ex => (
                <button key={ex} onClick={() => { setQuestion(ex); ask(ex); }}
                  className="text-left text-sm px-4 py-3 rounded-xl bg-surface border border-line text-ink2 hover:border-line2 hover:text-ink hover:shadow-soft transition group">
                  <span className="block group-hover:text-ink">{ex}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {error && (
          <div className="mb-6 p-4 rounded-xl bg-danger/10 border border-danger/30 text-sm text-danger">
            <strong className="font-medium">Error:</strong> <span className="text-ink">{error}</span>
          </div>
        )}

        {loading && (
          <div className="bg-surface rounded-2xl border border-line p-8 text-center fade-up">
            <div className="w-6 h-6 mx-auto mb-3 border-2 border-ink2/30 border-t-ink rounded-full animate-spin"/>
            <div className="text-sm text-ink2 italic font-serif">Kronos is consulting {cfg.shortLabel}…</div>
          </div>
        )}

        {answer && !loading && (
          <div className="bg-surface rounded-2xl border border-line p-7 mb-8 fade-up">
            <div className="flex items-center gap-2 pb-4 mb-4 border-b border-line">
              <div className="w-7 h-7 rounded-full bg-accentSoft text-accent2 grid place-items-center font-serif font-semibold text-sm">K</div>
              <div className="text-xs text-ink2">Kronos · via {cfg.shortLabel}</div>
            </div>
            <div className="prose-kronos" dangerouslySetInnerHTML={{ __html: renderMarkdown(answer) }} />
          </div>
        )}

        {history.length > 0 && (
          <div className="mt-12 pt-8 border-t border-line">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-xs font-medium text-ink2 uppercase tracking-[0.18em]">Recent</h3>
              <button onClick={() => { setHistory([]); localStorage.removeItem(historyKeyName); }}
                className="text-xs text-ink3 hover:text-danger">Clear history</button>
            </div>
            <div className="space-y-1.5">
              {history.map(h => (
                <button key={h.t}
                  onClick={() => { setQuestion(h.q); setAnswer(h.a); setError(""); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                  className="block w-full text-left px-4 py-2.5 rounded-lg text-sm text-ink2 hover:bg-surface hover:text-ink transition">
                  {h.q}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  // Helper used by SearchPage hero greeting (extracts a friendly first name)
  function user_first_name() {

      const session = JSON.parse(localStorage.getItem("session") || "null");
      if (session?.name) return session.name.split(/\s+/)[0];
    } catch {}
    return "friend";

  // ---------- REGISTER FORM (3-step) ----------
  function RegisterForm({ onRegistered, switchToLogin }) {
    const [step, setStep] = useState(1);
    const [name, setName] = useState("");
    const [email, setEmail] = useState("");
    const [otpSent, setOtpSent] = useState("");      // expected OTP
    const [otpInput, setOtpInput] = useState("");
    const [password, setPassword] = useState("");
    const [confirm, setConfirm] = useState("");
    const [error, setError] = useState("");
    const [busy, setBusy] = useState(false);
    const [info, setInfo] = useState("");

    const sendOTP = async (resend = false) => {
      setError("");
      setInfo("");
      if (!name.trim()) return setError("Name is required.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setError("Enter a valid email address.");
      const users = loadUsers();
      if (users[email.trim().toLowerCase()]) return setError("An account with this email already exists.");
      setBusy(true);
      try {
        const otp = generateOTP();
        await sendOTPEmail(loadEmailJSConfig(), email.trim().toLowerCase(), name.trim(), otp);
        setOtpSent(otp);
        setStep(2);
        setInfo(resend ? "A new OTP has been sent to your email." : "OTP sent! Check your inbox (and spam folder).");
      } catch (err) {
        setError(err.message);
      } finally {
        setBusy(false);
      }
    };

    const verifyOTP = () => {
      setError("");
      if (otpInput.trim() !== otpSent) return setError("OTP doesn't match. Please try again.");
      setStep(3);
      setInfo("");
    };

    const finishRegister = async (e) => {
      e.preventDefault();
      setError("");
      if (password.length < 8) return setError("Password must be at least 8 characters.");
      if (password !== confirm) return setError("Passwords do not match.");
      setBusy(true);
      try {
        const user = await registerUser(name, email, password);
        saveSession(user);
        onRegistered(user);
      } catch (err) {
        setError(err.message);
      } finally {
        setBusy(false);
      }
    };

    return (
      <div className="space-y-4">
        {/* Step indicator */}
        <div className="flex items-center gap-1.5 mb-1">
          {[1, 2, 3].map(n => (
            <div key={n} className={`h-1 flex-1 rounded-full transition-colors ${n <= step ? "bg-ink" : "bg-line"}`}/>
          ))}
        </div>
        <div className="text-[11px] text-ink3 uppercase tracking-[0.18em] mb-3">
          Step {step} of 3 · {step === 1 ? "Your details" : step === 2 ? "Verify email" : "Set password"}
        </div>

        {step === 1 && (
          <>
            <div>
              <label className="block text-xs font-medium text-ink2 mb-1.5 uppercase tracking-wider">Name</label>
              <input value={name} onChange={e => setName(e.target.value)} autoComplete="name"
                className="w-full px-3.5 py-2.5 rounded-lg border border-line focus:border-accent focus:ring-2 focus:ring-accentSoft outline-none text-sm"/>
            </div>
            <div>
              <label className="block text-xs font-medium text-ink2 mb-1.5 uppercase tracking-wider">Email</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="email"
                className="w-full px-3.5 py-2.5 rounded-lg border border-line focus:border-accent focus:ring-2 focus:ring-accentSoft outline-none text-sm"/>
            </div>
            {error && <div className="text-xs text-danger bg-danger/10 border border-danger/30 rounded-lg p-2.5">{error}</div>}
            <button onClick={() => sendOTP(false)} disabled={busy}
              className="w-full py-3 rounded-lg bg-ink text-paper text-sm font-medium hover:bg-ink/90 disabled:opacity-60 transition">
              {busy ? "Sending code…" : "Send verification code"}
            </button>
          </>
        )}

        {step === 2 && (
          <>
            <p className="text-sm text-ink2 leading-relaxed">A 6-digit code was sent to <strong className="text-ink">{email}</strong>.</p>
            {info && <div className="text-xs text-ok bg-ok/10 border border-ok/30 rounded-lg p-2.5">{info}</div>}
            <div>
              <label className="block text-xs font-medium text-ink2 mb-1.5 uppercase tracking-wider">Verification code</label>
              <input value={otpInput} onChange={e => setOtpInput(e.target.value.replace(/\D/g, "").slice(0, 6))}
                inputMode="numeric" maxLength={6} placeholder="······"
                className="w-full px-3.5 py-3 rounded-lg border border-line focus:border-accent focus:ring-2 focus:ring-accentSoft outline-none text-center text-2xl font-serif tracking-[0.5em]"/>
            </div>
            {error && <div className="text-xs text-danger bg-danger/10 border border-danger/30 rounded-lg p-2.5">{error}</div>}
            <button onClick={verifyOTP} disabled={otpInput.length !== 6}
              className="w-full py-3 rounded-lg bg-ink text-paper text-sm font-medium hover:bg-ink/90 disabled:opacity-60 transition">
              Verify
            </button>
            <div className="flex justify-between text-xs">
              <button onClick={() => { setStep(1); setOtpInput(""); setError(""); }} className="text-ink2 hover:text-ink">← Back</button>
              <button onClick={() => sendOTP(true)} disabled={busy} className="text-accent2 hover:underline">{busy ? "Sending…" : "Resend code"}</button>
            </div>
          </>
        )}

        {step === 3 && (
          <form onSubmit={finishRegister} className="space-y-4">
            <p className="text-sm text-ink2 leading-relaxed">Email verified. Now choose a password for <strong className="text-ink">{email}</strong>.</p>
            <div>
              <label className="block text-xs font-medium text-ink2 mb-1.5 uppercase tracking-wider">Password <span className="text-ink3 normal-case tracking-normal">(min 8 chars)</span></label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="new-password"
                className="w-full px-3.5 py-2.5 rounded-lg border border-line focus:border-accent focus:ring-2 focus:ring-accentSoft outline-none text-sm"/>
            </div>
            <div>
              <label className="block text-xs font-medium text-ink2 mb-1.5 uppercase tracking-wider">Confirm password</label>
              <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} autoComplete="new-password"
                className="w-full px-3.5 py-2.5 rounded-lg border border-line focus:border-accent focus:ring-2 focus:ring-accentSoft outline-none text-sm"/>
            </div>
            {error && <div className="text-xs text-danger bg-danger/10 border border-danger/30 rounded-lg p-2.5">{error}</div>}
            <button type="submit" disabled={busy} className="w-full py-3 rounded-lg bg-ink text-paper text-sm font-medium hover:bg-ink/90 disabled:opacity-60 transition">
              {busy ? "Creating account…" : "Create account"}
            </button>
          </form>
        )}

        <div className="text-center text-xs text-ink2 pt-2">
          Already have an account?{" "}
          <button type="button" onClick={switchToLogin} className="text-accent2 font-medium hover:underline">Sign in</button>
        </div>
      </div>
    );
  }

  // ---------- AUTH SCREEN (Login/Register host) ----------
  function AuthScreen({ onLogin, theme, onToggleTheme }) {
    const [tab, setTab] = useState("login");

    return (
      <div className="min-h-screen grid place-items-center px-4 py-12 relative">
        {/* Theme toggle floats top-right on the auth screen too */}
        {onToggleTheme && (
          <div className="absolute top-5 right-5">
            <ThemeToggle theme={theme} onToggle={onToggleTheme}/>
          </div>
        )}
        <div className="w-full max-w-[420px] fade-up">
          {/* Brand */}
          <div className="text-center mb-10">
            <div className="wordmark text-2xl mb-3">KRONOS</div>
            <h1 className="font-serif text-3xl text-ink mb-2 leading-tight">
              {tab === "login" ? "Welcome back." : "Create your account."}
            </h1>
            <p className="text-sm text-ink2">
              {tab === "login" ? "Sign in to continue." : "A few quick steps to get started."}
            </p>
          </div>

          {/* Auth card */}
          <div className="bg-surface rounded-2xl border border-line p-7 shadow-soft">
            <div className="flex gap-1 mb-6 border-b border-line">
              {["login", "register"].map(t => (
                <button key={t} onClick={() => setTab(t)}
                  className={`flex-1 pb-3 text-sm font-medium transition relative ${
                    tab === t ? "text-ink" : "text-ink3 hover:text-ink2"
                  }`}>
                  {t === "login" ? "Sign in" : "Register"}
                  {tab === t && <span className="absolute bottom-[-1px] left-0 right-0 h-[2px] bg-ink"/>}
                </button>
              ))}
            </div>
            {tab === "login"
              ? <LoginForm onLogin={onLogin} switchToRegister={() => setTab("register")}/>
              : <RegisterForm onRegistered={onLogin} switchToLogin={() => setTab("login")}/>}
          </div>

        </div>
      </div>
    );
  }

  // ---------- TOOL CARD ----------
  function ToolCard({ tool }) {
    const [logoFailed, setLogoFailed] = useState(false);
    // Cursor-tracking spotlight to match the news cards
    const onMove = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      e.currentTarget.style.setProperty("--mx", `${e.clientX - rect.left}px`);
      e.currentTarget.style.setProperty("--my", `${e.clientY - rect.top}px`);
    };
    return (
      <article onMouseMove={onMove}
        className="news-card bg-surface rounded-xl border border-line p-5 flex flex-col">
        {/* Header: logo + name + tags */}
        <div className="flex items-start gap-3.5 mb-3">
          <div className="shrink-0 w-11 h-11 rounded-lg bg-accentSoft border border-line2 grid place-items-center overflow-hidden">
            {!logoFailed ? (
              <img
                src={`https://www.google.com/s2/favicons?domain=${tool.domain}&sz=128`}
                onError={() => setLogoFailed(true)}
                alt=""
                className="w-7 h-7 object-contain"
              />
            ) : (
              <span className="font-serif text-base font-semibold text-ink">
                {tool.displayName[0]}
              </span>
            )}
          </div>
          <div className="min-w-0 flex-1">
            <h3 className="font-serif text-base text-ink leading-tight mb-1 truncate">{tool.displayName}</h3>
            <div className="flex flex-wrap gap-1">
              {(tool.tags || []).map(tag => (
                <span key={tag} className="text-[10px] uppercase tracking-wider text-ink2 border border-line rounded-md px-1.5 py-0.5 leading-tight">
                  {tag}
                </span>
              ))}
            </div>
          </div>
        </div>

        {/* Description */}
        <p className="text-sm text-ink2 leading-relaxed mb-4 line-clamp-3 flex-1">
          {tool.description}
        </p>

        {/* Footer: links */}
        <div className="flex items-center gap-3 mt-auto pt-3 border-t border-line">
          <a href={tool.homepage} target="_blank" rel="noopener noreferrer"
             className="inline-flex items-center gap-1 text-sm font-medium text-ink hover:text-accent2 transition">
            Visit
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M7 17L17 7M7 7h10v10"/>
            </svg>
          </a>
          <span className="text-ink3">·</span>
          <a href={tool.docs} target="_blank" rel="noopener noreferrer"
             className="inline-flex items-center gap-1 text-sm text-ink2 hover:text-ink transition">
            Docs
          </a>
          <span className="ml-auto text-[10px] uppercase tracking-wider text-ink3">{tool.domain}</span>
        </div>
      </article>
    );
  }

  // ---------- PAGINATION ----------
  function Pagination({ page, totalPages, onChange }) {
    if (totalPages <= 1) return null;

    // Build a compact list of page numbers with ellipses
    const pages = [];
    const window_ = 1; // numbers on each side of current
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= page - window_ && i <= page + window_)) {
        pages.push(i);
      } else if (pages[pages.length - 1] !== "…") {
        pages.push("…");
      }
    }

    const btn = "min-w-[34px] h-9 px-3 rounded-md text-sm font-medium transition flex items-center justify-center";
    return (
      <nav className="flex items-center justify-center gap-1.5 mt-10" aria-label="Pagination">
        <button onClick={() => onChange(Math.max(1, page - 1))} disabled={page === 1}
          className={`${btn} border border-line text-ink2 hover:text-ink hover:bg-surface2 disabled:opacity-40 disabled:cursor-not-allowed`}>
          ← Previous
        </button>
        {pages.map((p, i) => p === "…" ? (
          <span key={`e${i}`} className="px-2 text-ink3">…</span>
        ) : (
          <button key={p} onClick={() => onChange(p)}
            className={`${btn} ${
              p === page
                ? "bg-ink text-paper"
                : "text-ink2 hover:text-ink hover:bg-surface2"
            }`}>
            {p}
          </button>
        ))}
        <button onClick={() => onChange(Math.min(totalPages, page + 1))} disabled={page === totalPages}
          className={`${btn} border border-line text-ink2 hover:text-ink hover:bg-surface2 disabled:opacity-40 disabled:cursor-not-allowed`}>
          Next →
        </button>
      </nav>
    );
  }

  // ---------- TOOLS PAGE ----------
  function ToolsPage() {
    const PER_PAGE = 9;
    const [page, setPage] = useState(1);
    const [query, setQuery] = useState("");
    const [tagFilter, setTagFilter] = useState("all");

    // Read from window.AI_TOOLS and skip aliases/hidden entries
    const allTools = useMemo(() => {
      return Object.entries(window.AI_TOOLS)
        .filter(([_, t]) => !t.hidden && !t.aliasOf && t.displayName)
        .map(([key, t]) => ({ key, ...t }))
        .sort((a, b) => a.displayName.localeCompare(b.displayName));
    }, []);

    const allTags = useMemo(() => {
      const set = new Set();
      allTools.forEach(t => (t.tags || []).forEach(tag => set.add(tag)));
      return Array.from(set).sort();
    }, [allTools]);

    const filtered = useMemo(() => {
      let out = allTools;
      if (tagFilter !== "all") {
        out = out.filter(t => (t.tags || []).includes(tagFilter));
      }
      if (query.trim()) {
        const q = query.toLowerCase();
        out = out.filter(t =>
          t.displayName.toLowerCase().includes(q) ||
          (t.description || "").toLowerCase().includes(q) ||
          (t.tags || []).some(tag => tag.toLowerCase().includes(q))
        );
      }
      return out;
    }, [allTools, tagFilter, query]);

    const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
    const current = filtered.slice((page - 1) * PER_PAGE, page * PER_PAGE);

    // Reset to page 1 when filters change
    useEffect(() => { setPage(1); }, [tagFilter, query]);

    return (
      <div className="max-w-6xl mx-auto px-6 py-12">
        {/* Header */}
        <div className="mb-10 fade-up">
          <div className="text-xs uppercase tracking-[0.2em] text-ink2 mb-3">
            The Directory · {allTools.length} tools indexed
          </div>
          <h1 className="font-serif text-4xl md:text-5xl text-ink leading-[1.1] mb-4 max-w-3xl">
            Every AI tool, in one place.
          </h1>
          <p className="text-ink2 max-w-2xl leading-relaxed text-[15px]">
            A curated catalogue of the AI tools, models, and platforms shaping the
            industry — categorized, searchable, and linked to each product's homepage
            and official documentation.
          </p>
        </div>

        {/* Controls */}
        <div className="flex flex-col md:flex-row gap-2 mb-8 items-stretch md:items-center">
          <div className="flex-1 relative">
            <input
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder="Search tools by name, tag, or description…"
              className="w-full pl-10 pr-3 py-2.5 rounded-lg border border-line focus:border-line2 focus:ring-2 focus:ring-surface2 outline-none text-sm"
            />
            <svg className="w-4 h-4 absolute left-3 top-3 text-ink3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-4.35-4.35M17 10A7 7 0 113 10a7 7 0 0114 0z"/>
            </svg>
          </div>
          <FilterDropdown
            label="Category"
            value={tagFilter}
            onChange={setTagFilter}
            options={[
              { value: "all", label: "All categories" },
              ...allTags.map(t => ({ value: t, label: t }))
            ]}
          />
        </div>

        {/* Result count */}
        <div className="text-xs text-ink3 mb-5">
          {filtered.length} {filtered.length === 1 ? "tool" : "tools"}
          {tagFilter !== "all" && <> in <span className="text-ink2">{tagFilter}</span></>}
          {query.trim() && <> matching <span className="text-ink2">"{query}"</span></>}
        </div>

        {/* Grid */}
        {filtered.length === 0 ? (
          <div className="text-center py-20 text-ink2 font-serif italic">
            No tools match those filters.
          </div>
        ) : (
          <>
            <div className="news-grid grid md:grid-cols-2 lg:grid-cols-3 gap-5 fade-up">
              {current.map(tool => <ToolCard key={tool.key} tool={tool}/>)}
            </div>
            <Pagination page={page} totalPages={totalPages} onChange={setPage}/>
          </>
        )}
      </div>
    );
  }

  // ---------- CUSTOM FILTER DROPDOWN ----------
  function FilterDropdown({ value, onChange, options, label = "Filter" }) {
    const [open, setOpen] = useState(false);
    const ref = React.useRef(null);
    const current = options.find(o => o.value === value) || options[0];

    useEffect(() => {
      if (!open) return;
      const onDocClick = (e) => {
        if (ref.current && !ref.current.contains(e.target)) setOpen(false);
      };
      const onEsc = (e) => { if (e.key === "Escape") setOpen(false); };
      document.addEventListener("mousedown", onDocClick);
      document.addEventListener("keydown", onEsc);
      return () => {
        document.removeEventListener("mousedown", onDocClick);
        document.removeEventListener("keydown", onEsc);
      };
    }, [open]);

    return (
      <div className="relative" ref={ref}>
        <button type="button" onClick={() => setOpen(o => !o)}
          className="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border border-line bg-surface text-sm text-ink hover:bg-surface2 hover:border-line2 transition min-w-[170px] justify-between">
          <span className="flex items-center gap-2">
            <span className="text-ink3 text-xs uppercase tracking-wider">{label}</span>
            <span className="font-medium">{current?.label}</span>
          </span>
          <svg className={`transition-transform duration-200 ${open ? "rotate-180" : ""}`}
               width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        {open && (
          <div className="absolute right-0 mt-1.5 min-w-[200px] max-h-72 overflow-y-auto bg-surface border border-line2 rounded-lg shadow-lift z-30 fade-up py-1">
            {options.map(opt => {
              const selected = opt.value === value;
              return (
                <button key={opt.value} type="button"
                  onClick={() => { onChange(opt.value); setOpen(false); }}
                  className={`w-full text-left px-3.5 py-2 text-sm transition flex items-center justify-between gap-2 ${
                    selected
                      ? "text-ink bg-accentSoft font-medium"
                      : "text-ink2 hover:text-ink hover:bg-surface2"
                  }`}>
                  <span>{opt.label}</span>
                  {selected && (
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M20 6L9 17l-5-5"/>
                    </svg>
                  )}
                </button>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ---------- WELCOME OVERLAY (login animation) ----------
  function WelcomeOverlay({ name, onComplete }) {
    useEffect(() => {
      // Match the total duration of the CSS animation (2.7s)
      const t = setTimeout(onComplete, 2700);
      return () => clearTimeout(t);
    }, [onComplete]);
    const first = (name || "").trim().split(/\s+/)[0] || "friend";
    return (
      <div className="welcome-overlay" aria-hidden="true">
        <div className="welcome-content">
          <div className="welcome-brand">KRONOS</div>
          <div className="welcome-divider"/>
          <div className="welcome-greeting">Welcome back, <strong>{first}</strong>.</div>
        </div>
      </div>
    );
  }

  // ---------- ROOT (with auth gate + theme + welcome animation) ----------
  function App() {
    const [user, setUser] = useState(() => loadSession());
    const [active, setActive] = useState("news");
    const [theme, setTheme] = useState(() => {
      const saved = localStorage.getItem("theme");
      return saved === "light" ? "light" : "dark"; // default = dark
    });
    const [showWelcome, setShowWelcome] = useState(false);

    // Sync the html.dark class with state and persist
    useEffect(() => {
      if (theme === "dark") document.documentElement.classList.add("dark");
      else document.documentElement.classList.remove("dark");
      localStorage.setItem("theme", theme);
    }, [theme]);

    // Wrapped login: sets both user AND showWelcome in the same React batched
    // update so the welcome overlay paints in the same frame the main UI
    // first mounts — no flash of the unannounced app.
    const handleLogin = (newUser) => {
      setShowWelcome(true);
      setUser(newUser);
    };

    const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");

    if (!user) return <AuthScreen onLogin={handleLogin} theme={theme} onToggleTheme={toggleTheme}/>;

    const logout = () => { saveSession(null); setUser(null); };

    return (
      <div className="min-h-screen">
        <Header active={active} setActive={setActive} user={user} onLogout={logout}
          theme={theme} onToggleTheme={toggleTheme}/>
        {active === "news"  && <NewsPage />}
        {active === "tools" && <ToolsPage />}
        {active === "search" && <SearchPage userKey={user.email}/>}
        <footer className="mt-20 py-10 border-t border-line">
          <div className="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="wordmark text-xs text-ink2">KRONOS</div>
            <div className="text-[11px] text-ink3 text-center sm:text-right">
              News via TechCrunch · The Verge · Ars Technica · Wired · MIT Tech Review
            </div>
          </div>
        </footer>
        {showWelcome && <WelcomeOverlay name={user.name} onComplete={() => setShowWelcome(false)}/>}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
  </script>
</body>
</html>
